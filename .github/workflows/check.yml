name: Monitor CIE news

on:
  schedule:
    # 06:00–17:00 UTC, hourly. Covers 08–18 Europe/Rome in both CET and CEST;
    # main.py filters outer-edge runs via zoneinfo. EOD recap fires on the
    # first run with Rome hour >= 17, with a fallback at 18 if the first is
    # delayed/skipped by GitHub Actions cron.
    - cron: '0 6-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-cie
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit state.json if changed
        run: |
          if [[ -n "$(git status --porcelain state.json 2>/dev/null)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m "state: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no state changes"
          fi
