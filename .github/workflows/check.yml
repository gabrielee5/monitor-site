name: Monitor CIE news

on:
  # Schedule paused — job complete. Re-enable by uncommenting the cron line.
  # schedule:
  #   # 06:00–19:00 UTC, hourly. Active fetch window is 08–18 Europe/Rome
  #   # (filtered in main.py). Runs 17–19 UTC (= 19–21 Rome CEST / 18–20 CET)
  #   # are EOD-only safety nets — GitHub Actions cron is routinely delayed
  #   # 30+ min at the top of the hour, so several late attempts guarantee
  #   # the recap fires.
  #   - cron: '0 6-19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-cie
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit state.json if changed
        run: |
          if [[ -n "$(git status --porcelain state.json 2>/dev/null)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m "state: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no state changes"
          fi
